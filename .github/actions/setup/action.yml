name: Frozen NEXUS environment
description: Install the supported core Python and frozen development dependencies.
inputs:
  cache-suffix:
    description: Separate caches for independent job groups.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: 0.12.21
        enable-cache: true
        prune-cache: true
        cache-suffix: ${{ inputs.cache-suffix }}
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
          .python-version
    - shell: bash
      run: uv sync --frozen --all-extras
