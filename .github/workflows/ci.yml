name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# Superseded PRs may cancel; each main/queue/manual run keeps its own group.
concurrency:
  group: nexus-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXUS_PR_HEAD: ${{ github.event.pull_request.head.sha }}
  UV_PYTHON: 3.14.7
jobs:
  quality:
    name: Quality and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-suffix: quality
      - run: make ci GROUP=quality
      - name: Upload results and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-quality
          path: ci-results/quality/
          retention-days: 7
  host:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - scientific
          - planning
          - interfaces
          - evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-suffix: host-${{ matrix.group }}
      - name: Install minimum operator Python
        if: ${{ matrix.group == 'evaluation' }}
        id: operator
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: make ci GROUP="${CI_GROUP}"
        env:
          CI_GROUP: ${{ matrix.group }}
          NEXUS_OPERATOR_PYTHON: ${{ steps.operator.outputs.python-path }}
      - name: Upload results and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-host-${{ matrix.group }}
          path: ci-results/${{ matrix.group }}/
          retention-days: 7
  container:
    name: Containers (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group:
          - scientific
          - planning
          - panels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-suffix: container-${{ matrix.group }}
      - run: make ci GROUP="container-${CI_GROUP}"
        env:
          CI_GROUP: ${{ matrix.group }}
      - name: Upload results and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-container-${{ matrix.group }}
          path: ci-results/container-${{ matrix.group }}/
          retention-days: 7
  complete:
    name: complete
    if: ${{ always() }}
    needs:
      - quality
      - host
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every group to succeed
        run: python3 scripts/ci.py gate
        env:
          NEXUS_CI_NEEDS: ${{ toJSON(needs) }}
