name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      full:
        description: "Run extended tests, cross-seed stress, CLI smoke, and container smoke"
        required: true
        type: boolean
        default: false
      stress_seed_count:
        description: "Cross-seed sample size for a full run"
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "10"
        default: "5"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py314-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py314-

      - name: Install uv
        run: python -m pip install --no-deps uv==0.12.21

      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Solver proof tests
        run: |
          uv run pytest -q tests/unit/test_belief_policy.py --maxfail=1 --durations=10

      - name: Fast tests
        run: |
          uv run pytest -q -m "not slow and not stress" tests/unit tests/integration \
            --ignore=tests/unit/test_belief_policy.py --maxfail=1 --durations=15

      - name: Extended unit and integration tests
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && github.base_ref == 'feat/epistemic-calibration') }}
        run: |
          uv run pytest -q -m slow tests/unit tests/integration \
            --maxfail=1 --durations=20

      - name: Cross-seed property stress
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && github.base_ref == 'feat/epistemic-calibration') }}
        env:
          NEXUS_STRESS_SEED_COUNT: ${{ inputs.stress_seed_count || '3' }}
          NEXUS_STRESS_FAIL_FAST: "1"
        run: |
          uv run pytest -q -m stress tests/property --maxfail=1 --durations=20

      - name: CLI smoke test
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && github.base_ref == 'feat/epistemic-calibration') }}
        run: |
          uv run nexus generate /tmp/nexus-smoke --seed 17 --discovery-level 2 \
            --planning-level 3 --resource-pressure 2
          uv run nexus qualify /tmp/nexus-smoke/private.json
          uv run nexus solve /tmp/nexus-smoke/private.json --trace-out /tmp/nexus-smoke/run.jsonl
          uv run nexus replay /tmp/nexus-smoke/private.json /tmp/nexus-smoke/run.jsonl
          uv run nexus generate /tmp/nexus-t3-smoke --seed 17 --discovery-level 2 \
            --planning-level 3 --resource-pressure 2 --theory-level 3
          uv run nexus qualify /tmp/nexus-t3-smoke/private.json
          uv run nexus solve /tmp/nexus-t3-smoke/private.json --trace-out /tmp/nexus-t3-smoke/run.jsonl
          uv run nexus replay /tmp/nexus-t3-smoke/private.json /tmp/nexus-t3-smoke/run.jsonl
          uv run nexus generate /tmp/nexus-science-smoke --axis-version 2 --seed 17 \
            --discovery-level 5 --theory-level 3 --planning-level 1 --resource-pressure 1
          uv run nexus qualify /tmp/nexus-science-smoke/private.json
          uv run nexus solve /tmp/nexus-science-smoke/private.json --trace-out /tmp/nexus-science-smoke/run.jsonl
          uv run nexus replay /tmp/nexus-science-smoke/private.json /tmp/nexus-science-smoke/run.jsonl
          uv run nexus generate /tmp/nexus-network-smoke --axis-version 2 --seed 17 \
            --science-family coupled-network-v1 --discovery-level 5 --theory-level 3 \
            --planning-level 1 --resource-pressure 1
          uv run nexus qualify /tmp/nexus-network-smoke/private.json
          uv run nexus solve /tmp/nexus-network-smoke/private.json --trace-out /tmp/nexus-network-smoke/run.jsonl
          uv run nexus replay /tmp/nexus-network-smoke/private.json /tmp/nexus-network-smoke/run.jsonl
          uv run nexus generate /tmp/nexus-resonant-smoke --axis-version 2 --seed 17 \
            --science-family resonant-network-v1 --discovery-level 5 --theory-level 3 \
            --planning-level 1 --resource-pressure 1
          uv run nexus solve /tmp/nexus-resonant-smoke/private.json --trace-out /tmp/nexus-resonant-smoke/run.jsonl
          uv run nexus replay /tmp/nexus-resonant-smoke/private.json /tmp/nexus-resonant-smoke/run.jsonl

      - name: Container smoke test
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && github.base_ref == 'feat/epistemic-calibration') }}
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t nexus-ci .
          test "$(docker image inspect nexus-ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint python nexus-ci --version
          docker run --rm nexus-ci --help
          docker run --rm nexus-ci generate /tmp/nexus-t3 --seed 17 \
            --discovery-level 2 --planning-level 0 --theory-level 3
          docker run --rm nexus-ci generate /tmp/nexus-science --axis-version 2 --seed 17 \
            --discovery-level 5 --planning-level 0 --theory-level 3 --resource-pressure 0
          docker run --rm -e NEXUS_SCIENCE_FAMILY=coupled-network-v1 nexus-ci generate \
            /tmp/nexus-network --axis-version 2 --seed 17 --discovery-level 5 \
            --planning-level 1 --theory-level 3 --resource-pressure 1
          docker run --rm -e NEXUS_SCIENCE_FAMILY=resonant-network-v1 nexus-ci generate \
            /tmp/nexus-resonant --axis-version 2 --seed 17 --discovery-level 5 \
            --planning-level 1 --theory-level 3 --resource-pressure 1
