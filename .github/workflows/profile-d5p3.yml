name: D5 P3 generation profile

on:
  push:
    branches: ["feat/terminal-diagnostics-generation-profile"]
    paths:
      - "scripts/profile_generation.py"
      - ".github/workflows/profile-d5p3.yml"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        run: python -m pip install --no-deps uv==0.12.21

      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Profile D5 P2 baseline
        run: |
          uv run python scripts/profile_generation.py \
            --seed 17 --discovery-level 5 --planning-level 2 --resource-pressure 0 \
            --json-out /tmp/d5-p2.json

      - name: Profile D5 P3
        run: |
          uv run python scripts/profile_generation.py \
            --seed 17 --discovery-level 5 --planning-level 3 --resource-pressure 0 \
            --json-out /tmp/d5-p3.json
