name: Planning and coordination runner smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/smoke_planning_service.py"
      - "scripts/preflight_planning.py"
      - "scripts/preflight_coordination.py"
      - "scripts/package_coordination.py"
      - "examples/mindtrial/coordination-*"
      - "examples/mindtrial/nexus-planning-resource-*.yaml"
      - "examples/mindtrial/nexus-coordination-*.yaml"
      - "docs/planning-resource-matrix.json"
      - "docs/coordination-matrix.json"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/planning-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the exact feature revision
        run: |
          revision=$(git rev-parse HEAD)
          docker build --build-arg VCS_REF="$revision" -t nexus:planning-resource-v1 -t nexus:coordination-v1 .
          test "$(docker image inspect nexus:planning-resource-v1 --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$revision"
      - name: Qualify all 16 cases inside the image
        run: docker run --rm --entrypoint python nexus:planning-resource-v1 scripts/preflight_planning.py
      - name: Qualify all 40 coordination cases inside the image
        run: docker run --rm --entrypoint python nexus:coordination-v1 scripts/preflight_coordination.py
      - name: Verify the packaged launcher against the actual image without model calls
        run: |
          runtime_digest=$(docker run --rm --entrypoint python nexus:coordination-v1 -c 'from nexus.provenance import source_digest; print(source_digest())')
          python3 scripts/package_coordination.py --output-dir "$RUNNER_TEMP/coordination-package" --runtime-source-sha256 "$runtime_digest"
          bash "$RUNNER_TEMP/coordination-package/run.sh" --skip-build --preflight-only --suite all
      - name: Exercise real service, tool client, validator and shutdown telemetry
        run: |
          docker run --rm --entrypoint python \
            --mount "type=bind,source=$PWD/examples/mindtrial,target=/run-config,readonly" \
            nexus:planning-resource-v1 scripts/smoke_planning_service.py \
            --config /run-config/nexus-planning-resource-config.yaml \
            --tasks /run-config/nexus-planning-resource-tasks.yaml --rows all
      - name: Exercise coordination core and spatial services and receipts
        run: |
          for suite in core spatial slack; do
            docker run --rm --entrypoint python \
              --mount "type=bind,source=$PWD/examples/mindtrial,target=/run-config,readonly" \
              nexus:coordination-v1 scripts/smoke_planning_service.py \
              --config /run-config/nexus-coordination-config.yaml \
              --tasks "/run-config/nexus-coordination-$suite-tasks.yaml" --rows all
          done
