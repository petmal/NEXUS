<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 186" role="img" aria-labelledby="title description">
  <title id="title">A1's route in the introductory world</title>
  <desc id="description">Starting at R0, go to R4 and take A1. Return through R0 to R3 and use M1. Return through R0 to R2, drop A1 and finish. Only visited rooms are shown.</desc>
  <rect x="1" y="1" width="688" height="184" rx="14" fill="#f6f8fa" stroke="#a7b8c3"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#577181" stroke-width="3">
      <path d="M345 66 V79 H120 V106 M345 79 V106 M345 79 H570 V106"/>
    </g>
    <rect x="245" y="14" width="200" height="52" rx="9" fill="#143649"/>
    <text x="345" y="38" font-size="18" font-weight="bold" fill="white">R0 · Junction</text>
    <text x="345" y="57" font-size="13" fill="#d4e7ee">Start and return here</text>
    <g fill="white" stroke="#56818c" stroke-width="1.5">
      <rect x="20" y="106" width="200" height="60" rx="8"/><rect x="245" y="106" width="200" height="60" rx="8"/><rect x="470" y="106" width="200" height="60" rx="8"/>
    </g>
    <g fill="#123b47" font-size="17" font-weight="bold">
      <text x="120" y="131">1 · Collect in R4</text><text x="345" y="131">2 · Transform in R3</text><text x="570" y="131">3 · Deliver in R2</text>
    </g>
    <g fill="#344f59" font-size="14">
      <text x="120" y="151">Take artifact A1</text><text x="345" y="151">Use machine M1 on A1</text><text x="570" y="151">Drop A1, then finish</text>
    </g>
  </g>
</svg>
