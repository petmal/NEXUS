{
  "config": {
    "log-file": "./results/{{.Year}}-{{.Month}}-{{.Day}}/{{.Hour}}-{{.Minute}}-{{.Second}}.log",
    "output-dir": "./results/{{.Year}}-{{.Month}}-{{.Day}}/",
    "output-basename": "{{.Hour}}-{{.Minute}}-{{.Second}}",
    "task-source": "./nexus-coordination-core-tasks.yaml",
    "providers": [
      {
        "name": "openai",
        "retry-policy": {
          "max-retry-attempts": 0,
          "initial-delay-seconds": 30
        },
        "client-config": {
          "api-key": ""
        },
        "runs": [
          {
            "name": "GPT-6 Astra (medium) - coordination pilot",
            "disabled": false,
            "model": "gpt-6-astra",
            "max-requests-per-minute": 20,
            "model-parameters": {
              "reasoning-effort": "medium"
            }
          }
        ]
      }
    ],
    "tools": [
      {
        "name": "nexus",
        "image": "nexus:coordination-v1",
        "description": "Interact with one persistent NEXUS world; there is no reset. Begin with manifest and observe, then read every listed evidence file. Those files define the public laws, state display, complete map, goal and action costs.\n\nRequests: manifest, observe and status need only operation. evidence also needs filename from the manifest. action also needs an action object. Public reads do not spend world actions; every tool invocation counts toward the harness call limit.\n\nAction fields: observe/wait/finish require type only; move requires target (an adjacent room ID); take/drop require artifact; operate/probe require machine and artifact. Carry the original seal and be at the disclosed machine location. operate commits one transformation; probe previews one transformation without committing it. Both spend an action. There are no stocks, reset operations, configuration settings or separate measurement action.\n\nTrack the carried seal, committed changes, location and remaining allowance. All goal coordinates must hold simultaneously; a partial display match alone does not certify success. Return to the stated finish room and call finish. A successful finish returns victory_code; return exactly that receipt without explanation or formatting. Use only this tool. No external compute tool or source access is available.",
        "parameters": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "request": {
              "type": "object",
              "additionalProperties": false,
              "description": "One NEXUS request. Provide filename only for evidence and action only for action. Read manifest for controls and evidence names.",
              "properties": {
                "operation": {
                  "type": "string",
                  "enum": [
                    "manifest",
                    "evidence",
                    "observe",
                    "status",
                    "action"
                  ],
                  "description": "Operation to perform. Begin with manifest, then observe and read\nevery listed evidence file.\n"
                },
                "filename": {
                  "type": "string",
                  "description": "Required only for operation evidence. Use a filename returned\nby the manifest.\n"
                },
                "action": {
                  "type": "object",
                  "additionalProperties": false,
                  "description": "Required only for operation action. Include the fields required\nby the selected action type and omit unrelated fields.\n",
                  "properties": {
                    "type": {
                      "type": "string",
                      "enum": [
                        "observe",
                        "move",
                        "take",
                        "drop",
                        "operate",
                        "probe",
                        "wait",
                        "finish"
                      ],
                      "description": "NEXUS action type."
                    },
                    "target": {
                      "type": "string",
                      "description": "Adjacent destination room ID for move."
                    },
                    "artifact": {
                      "type": "string",
                      "description": "Individual artifact ID for take/drop/operate/probe; use the original seal described by the manifest."
                    },
                    "machine": {
                      "type": "string",
                      "description": "Disclosed machine ID for operate or probe; the carried seal and agent must be at that machine."
                    }
                  },
                  "required": [
                    "type"
                  ]
                }
              },
              "required": [
                "operation"
              ]
            }
          },
          "required": [
            "request"
          ]
        },
        "parameter-files": {
          "request": "/input/request.json"
        },
        "command": [
          "request",
          "--request-file",
          "/input/request.json"
        ],
        "dependencies": [
          {
            "service": "nexus",
            "env": {
              "NEXUS_URL": "{{ .Endpoint }}"
            }
          }
        ]
      }
    ],
    "services": [
      {
        "name": "nexus",
        "image": "nexus:coordination-v1",
        "command": [
          "serve-session"
        ],
        "env": {
          "NEXUS_HOST": "0.0.0.0",
          "NEXUS_PORT": "8000"
        },
        "endpoint": {
          "scheme": "http",
          "port": 8000
        },
        "input-env": {
          "axis-version": "NEXUS_AXIS_VERSION",
          "science-family": "NEXUS_SCIENCE_FAMILY",
          "seed": "NEXUS_SEED",
          "discovery-level": "NEXUS_DISCOVERY_LEVEL",
          "planning-level": "NEXUS_PLANNING_LEVEL",
          "resource-pressure": "NEXUS_RESOURCE_PRESSURE",
          "theory-level": "NEXUS_THEORY_LEVEL",
          "generation-timing": "NEXUS_GENERATION_TIMING",
          "budget-profile": "NEXUS_BUDGET_PROFILE",
          "extended-diagnostics": "NEXUS_EXTENDED_DIAGNOSTICS",
          "ontology-options": "NEXUS_ONTOLOGY_OPTIONS"
        },
        "healthcheck": [
          "nexus",
          "health"
        ],
        "startup-timeout": "120s"
      }
    ],
    "validators": [
      {
        "name": "nexus-victory",
        "image": "nexus:coordination-v1",
        "command": [
          "validate",
          "--candidate-file",
          "/input/candidate"
        ],
        "template-files": [
          {
            "path": "/input/candidate",
            "template": "{{ .Candidate.Response }}"
          }
        ],
        "dependencies": [
          {
            "service": "nexus",
            "env": {
              "NEXUS_URL": "{{ .Endpoint }}"
            }
          }
        ],
        "timeout": "30s"
      }
    ]
  }
}
