[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-benchmark"
version = "0.1.0"
description = "Procedurally generated artificial micro-worlds for LLM reasoning evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Petr Malik"}]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "networkx>=3.4,<4",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8.3,<9", "hypothesis>=6.120,<7"]

[project.scripts]
nexus = "nexus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
