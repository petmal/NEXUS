[build-system]
requires = ["hatchling>=1.32.3,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-benchmark"
version = "0.1.0"
description = "Procedurally generated artificial micro-worlds for LLM reasoning evaluation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
authors = [{name = "Petr Malik"}]
dependencies = [
  "pydantic>=2.13.5,<2.14",
  "typer>=0.27.2,<0.28",
  "rich>=15.0.0,<16",
  "networkx>=3.7,<3.8",
]

[project.optional-dependencies]
server = ["fastapi>=0.141.1,<0.142", "uvicorn>=0.54.0,<0.55"]
dev = [
  "pytest>=9.1.1,<10",
  "hypothesis>=6.168.3,<7",
  "httpx2>=2.13.1,<3",
]

[project.scripts]
nexus = "nexus.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: broader multi-profile tests kept out of the default paid CI fast gate",
  "stress: cross-seed/property stress tests intended for explicit full validation",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.per-file-target-version]
"examples/mindtrial/*-runner.py" = "py312"
"examples/mindtrial/summarize-pilot-results.py" = "py312"
