[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "nexus-benchmark"
version = "0.1.0"
description = "Procedurally generated artificial micro-worlds for LLM reasoning evaluation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
authors = [{name = "Petr Malik"}]
dependencies = [
  "pydantic==2.13.5",
  "typer==0.27.2",
  "rich==15.0.0",
  "networkx==3.7",
]

[project.optional-dependencies]
server = ["fastapi==0.141.1", "uvicorn==0.54.0"]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.3",
  "httpx2==2.13.1",
]

[project.scripts]
nexus = "nexus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
